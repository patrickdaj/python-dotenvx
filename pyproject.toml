[project]
name = "python-dotenvx"
version = "0.0.1"
description = "A Python port of dotenvx — a better dotenv with built-in encryption."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "patrickdaj" }]
keywords = ["dotenv", "dotenvx", "env", "environment", "secrets", "encryption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "cryptography>=42",
    "coincurve>=20",
]

[project.urls]
Homepage = "https://github.com/patrickdaj/python-dotenvx"
Repository = "https://github.com/patrickdaj/python-dotenvx"

[project.scripts]
dotenvx = "dotenvx.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dotenvx"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]

# Runtime support floor is 3.9 (see requires-python; the CI matrix runs 3.9).
# mypy's own analysis target must be >= 3.10, so we type-check against 3.10.
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=dotenvx --cov-report=term-missing"
